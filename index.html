<!doctype html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
	<title>office</title>
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
		canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
		#hint {
			position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
			color: #fff; font: 500 18px system-ui, sans-serif; background: rgba(0, 0, 0, 0.35);
			pointer-events: none;
		}
		#prompt {
			position: fixed; left: 50%; bottom: 26%; transform: translateX(-50%);
			display: none;
			color: #fff; font: 600 32px system-ui, sans-serif; background: rgba(0, 0, 0, 0.55);
			padding: 12px 28px; border-radius: 8px; pointer-events: none; white-space: nowrap;
		}
		#prompt.low { bottom: 8%; }
		#flash {
			position: fixed; inset: 0; opacity: 0; pointer-events: none;
		}
	</style>
</head>
<body>
	<div id="hint">Кликни, чтобы осмотреться</div>
	<div id="prompt"></div>
	<div id="flash"></div>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
